<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lane2: AI interaction evidence for fair, transparent Lane 2 assessment. Synthetic data only.">
  <title>Lane2 · Teaching workspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23173438'/><rect x='9' y='8' width='6' height='16' rx='2' fill='%23dc7b38'/><rect x='17' y='8' width='6' height='16' rx='2' fill='%23287d76'/></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <button class="brand" type="button" data-nav="home" aria-label="Lane2 home: all courses">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
        <span><strong>Lane2</strong><small>Assessment workspace</small></span>
      </button>

      <div class="course-switcher">
        <span class="eyebrow">Current course</span>
        <button class="course-button" id="courseButton" type="button" aria-haspopup="listbox" aria-expanded="false" data-action="toggle-course-menu">
          <span class="course-code" id="courseBadge">··</span>
          <span><strong id="courseCode">All courses</strong><small id="courseSemester">Choose a course</small></span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
        </button>
        <div class="course-menu" id="courseMenu" role="listbox" hidden></div>
      </div>

      <nav class="nav-list" aria-label="Main">
        <button class="nav-item" data-nav="home" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-nav="courses" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z"/><path d="M5 21.5A2.5 2.5 0 0 1 7.5 19H20M9 7h7M9 11h6"/></svg>
          <span>Assignments</span>
        </button>
        <button class="nav-item" data-nav="reviews" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
          <span>Review dashboard</span><span class="nav-count" id="navReviewCount" hidden></span>
        </button>
        <button class="nav-item" data-nav="rules" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v5l-5.7 9.3A2.4 2.4 0 0 0 6.4 21h11.2a2.4 2.4 0 0 0 2.1-3.7L14 8V3"/><path d="M7.2 15h9.6"/></svg>
          <span>Rules &amp; Test Lab</span>
        </button>
        <button class="nav-item" data-nav="export" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          <span>Export</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-nav="admin" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2.5A4.5 4.5 0 0 1 9.5 14h5a4.5 4.5 0 0 1 4.5 4.5V21M19 4v4M17 6h4"/></svg>
          <span>Admin</span>
        </button>
      </nav>

      <button class="sidebar-help" type="button" data-action="open-guide">
        <span class="help-icon">?</span>
        <span><strong>Need a hand?</strong><small>Read the marker guide</small></span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg>
      </button>
      <div class="sidebar-profile">
        <div class="avatar avatar-navy" id="profileInitials"></div>
        <div><strong id="profileName"></strong><small id="profileRole"></small></div>
        <button class="logout-button" type="button" data-action="logout" aria-label="Log out" data-tip="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
        </button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><button class="icon-button" data-action="toggle-sidebar" aria-label="Open menu" type="button">☰</button><strong>Lane2</strong></div>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-actions">
          <div class="topbar-context"><span class="status-dot" id="syncDot"></span><span id="sync" aria-live="polite">Loading…</span></div>
        </div>
      </header>
      <main id="main" tabindex="-1"><p class="loading">Loading your courses…</p></main>
    </div>
  </div>

  <div id="authRoot"></div>
  <div class="drawer-backdrop" data-action="close-sidebar"></div>
  <div id="modalRoot"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div id="print-area"></div>

  <script src="js/engine.js"></script>
  <script src="js/testcases.js"></script>
  <script src="js/seed-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
