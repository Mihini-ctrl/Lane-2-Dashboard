# Render Blueprint for Lane2. The public service serves the UI and proxies
# authenticated /api/v1 requests to the backend over Render's private network.
# Supabase values are entered in the Render dashboard and never committed.
services:
  - type: web
    name: trace-lane2
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: echo "No frontend build step needed"
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKEND_URL
        value: https://trace-lane2-backend.onrender.com

  - type: web
    name: trace-lane2-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run backend:build
    startCommand: npm run backend:start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_AUTH_REDIRECT_URL
        value: https://trace-lane2.onrender.com
